# docker-compose.local.yml - Local database configuration
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:8000/ws/conversation
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
      - voice-agent

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/template1?sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - VOICE_ASSISTANT_API_URL=http://voice-agent:8000
      - VOICE_ASSISTANT_WS_URL=ws://voice-agent:8000/ws/conversation
      - VOICE_AGENT_SHARED_SECRET=2c99e4f256738c811fda12c7702f6886505d8435d6a65ee21e17022b1be208c0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "3000:3000"
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy

  voice-agent:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./voice-agent/backend:/app
      - python_cache:/root/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/template1?sslmode=disable
      - BACKEND_URL=http://backend:3000
      - BACKEND_SHARED_SECRET=2c99e4f256738c811fda12c7702f6886505d8435d6a65ee21e17022b1be208c0
      - TOKEN_EXPIRY_MINUTES=30
      - AUTH_DEV_MODE=true
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ELEVEN_API_KEY=${ELEVEN_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ASSEMBLY_API_KEY=${ASSEMBLY_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
    ports:
      - "8000:8000"
    command: sh -c "pip install --upgrade pip && pip install -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  backend_node_modules:
  python_cache: